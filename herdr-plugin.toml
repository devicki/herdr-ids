id = "devicki.ids"
name = "ids"
version = "0.4.2"
min_herdr_version = "0.9.1"
platforms = ["linux", "macos"]
description = "Show pane, tab and workspace ids in the sidebar, and pick a space, tab or pane to type its id into your agent."

# Tokens are runtime metadata, so write them all once the server is up, then keep them in step
# as panes appear or move (a cross-workspace move changes the pane id).
[[startup]]
command = ["bash", "ids.sh"]

[[actions]]
id = "sync"
title = "ids: resync tokens"
command = ["bash", "ids.sh"]

[[actions]]
id = "pick"
title = "ids: pick a target and type it"
contexts = ["pane"]
command = ["bash", "pick.sh", "open"]

# Keybindings can only invoke actions, so `pick` opens this popup for the focused pane.
[[panes]]
id = "picker"
title = "ids"
placement = "popup"
width = "90%"
height = "70%"
command = ["bash", "pick.sh"]

[[events]]
on = "pane.created"
command = ["bash", "ids.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "ids.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "ids.sh"]
